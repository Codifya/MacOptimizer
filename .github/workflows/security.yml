name: Security & Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Every Monday at 04:00 UTC

jobs:
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git --redact /github/workspace

  dependency-audit:
    name: Swift Package Audit
    runs-on: macos-15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          ls /Applications | grep Xcode
          test -d /Applications/Xcode_16.4.app || { echo "Xcode 16.4 is missing from this runner" >&2; exit 1; }
          sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Verify Swift Version
        run: swift --version

      - name: Resolve and List Dependencies
        run: |
          swift package resolve
          swift package show-dependencies
          echo "Dependency inventory complete; this package declares no third-party dependencies."
