name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15
    env:
      CANARY_SERVICE_PREFIX: com.codifya.MacOptimizerTests.

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          ls /Applications | grep Xcode
          test -d /Applications/Xcode_16.4.app || { echo "Xcode 16.4 is missing from this runner" >&2; exit 1; }
          sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Verify Swift Version
        run: swift --version

      - name: Build Package
        run: swift build -v --scratch-path "${{ runner.temp }}/swift-build"

      - name: Capture host canary
        shell: bash
        run: |
          echo "CLIPBOARD_BEFORE=$(pbpaste | shasum -a 256 | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "KEYCHAIN_ITEMS_BEFORE=$(security dump-keychain 2>/dev/null | awk -v service="$CANARY_SERVICE_PREFIX" 'index($0, service) { count++ } END { print count+0 }')" >> "$GITHUB_ENV"

      - name: Run Test Suite
        run: swift test --enable-code-coverage --scratch-path "${{ runner.temp }}/swift-build"

      - name: Verify host canary
        shell: bash
        run: |
          clipboard_after=$(pbpaste | shasum -a 256 | awk '{print $1}')
          keychain_items_after=$(security dump-keychain 2>/dev/null | awk -v service="$CANARY_SERVICE_PREFIX" 'index($0, service) { count++ } END { print count+0 }')
          test "$clipboard_after" = "$CLIPBOARD_BEFORE"
          test "$keychain_items_after" = "$KEYCHAIN_ITEMS_BEFORE"

      - name: Build Release App Bundle
        run: ./Scripts/build_app.sh
