<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS Squircle Drop Shadow -->
    <filter id="squircle-shadow" x="-15%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#020617" flood-opacity="0.45" />
    </filter>

    <!-- Shield Drop Shadow -->
    <filter id="shield-shadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#020617" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#020617" flood-opacity="0.30" />
    </filter>

    <!-- Dial Well Inner Recess Shadow -->
    <filter id="well-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <!-- Needle Drop Shadow -->
    <filter id="needle-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Squircle Tile Background: Deep Slate Indigo -->
    <linearGradient id="c1-tile-bg" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Squircle Top Ambient Sheen -->
    <radialGradient id="c1-sheen" cx="512" cy="110" r="550" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Squircle Chamfer Border Highlight -->
    <linearGradient id="c1-tile-stroke" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Shield Face Gradient: Left Half (Luminous Mint) -->
    <linearGradient id="c1-shield-left" x1="390" y1="240" x2="512" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="35%" stop-color="#10B981" />
      <stop offset="85%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>

    <!-- Shield Face Gradient: Right Half (Dimensional Shaded Teal) -->
    <linearGradient id="c1-shield-right" x1="630" y1="240" x2="512" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="35%" stop-color="#0D9488" />
      <stop offset="85%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#044E45" />
    </linearGradient>

    <!-- Shield Rim Chamfer Gradient -->
    <linearGradient id="c1-shield-rim" x1="512" y1="235" x2="512" y2="780" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="30%" stop-color="#6EE7B7" />
      <stop offset="80%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Dial Well Gradient: Deep Midnight Cavity -->
    <linearGradient id="c1-well-bg" x1="512" y1="300" x2="512" y2="650" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070D18" />
      <stop offset="50%" stop-color="#0B1526" />
      <stop offset="100%" stop-color="#132036" />
    </linearGradient>

    <!-- Health Arc Gradient: Optimal Calibration -->
    <linearGradient id="c1-arc-grad" x1="390" y1="580" x2="630" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="80%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Needle Gradient: Pure White with Crisp Silver Bevel -->
    <linearGradient id="c1-needle-grad" x1="0" y1="0" x2="126" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <!-- 1. Squircle Base with macOS drop shadow -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#c1-tile-bg)" filter="url(#squircle-shadow)" />
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#c1-sheen)" />
  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="184.25" fill="none" stroke="url(#c1-tile-stroke)" stroke-width="1.5" />

  <!-- 2. Sculpted Shield Emblem -->
  <g filter="url(#shield-shadow)">
    <!-- Shield Left Half -->
    <path d="M 512 238
             C 410 238, 318 266, 284 294
             C 275 302, 272 316, 272 332
             L 272 505
             C 272 645, 386 738, 506 776
             C 509 777, 511 777, 512 778
             L 512 238 Z"
          fill="url(#c1-shield-left)" />

    <!-- Shield Right Half -->
    <path d="M 512 238
             L 512 778
             C 513 777, 515 777, 518 776
             C 638 738, 752 645, 752 505
             L 752 332
             C 752 316, 749 302, 740 294
             C 706 266, 614 238, 512 238 Z"
          fill="url(#c1-shield-right)" />

    <!-- Shield Outer Chamfer Border -->
    <path d="M 512 238
             C 614 238, 706 266, 740 294
             C 749 302, 752 316, 752 332
             L 752 505
             C 752 645, 638 738, 518 776
             C 514 777, 510 777, 506 776
             C 386 738, 272 645, 272 505
             L 272 332
             C 272 316, 275 302, 284 294
             C 318 266, 410 238, 512 238 Z"
          fill="none"
          stroke="url(#c1-shield-rim)"
          stroke-width="5"
          stroke-linejoin="round" />

    <!-- Top Highlight Lip on Shield -->
    <path d="M 512 245
             C 608 245, 698 270, 732 296
             C 738 302, 742 310, 744 322
             L 744 505
             C 744 635, 635 725, 516 764
             C 514 765, 510 765, 508 764
             C 389 725, 280 635, 280 505
             L 280 322
             C 282 310, 286 302, 292 296
             C 326 270, 416 245, 512 245 Z"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.75"
          stroke-opacity="0.32" />

    <!-- Central Sculpted Spine Highlights -->
    <line x1="512" y1="246" x2="512" y2="292" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4" />
    <line x1="512" y1="655" x2="512" y2="762" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

    <!-- 3. Recessed Diagnostic Dial Well -->
    <circle cx="512" cy="475" r="180" fill="url(#c1-well-bg)" filter="url(#well-shadow)" />
    <!-- Well Inner Chamfer Rim -->
    <circle cx="512" cy="475" r="180" fill="none" stroke="#042F2E" stroke-width="4" stroke-opacity="0.5" />
    <circle cx="512" cy="475" r="178" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.12" />

    <!-- Gauge Track (Unfilled Sweep 215 to 325 deg) -->
    <path d="M 398.96 554.15 A 138 138 0 1 1 625.04 554.15"
          fill="none"
          stroke="#162338"
          stroke-width="36"
          stroke-linecap="round" />

    <!-- Active Health Arc (Optimal Health Calibration: 215 to 50 deg) -->
    <path d="M 398.96 554.15 A 138 138 0 0 1 600.70 369.29"
          fill="none"
          stroke="url(#c1-arc-grad)"
          stroke-width="36"
          stroke-linecap="round" />

    <!-- Calibration Reference Markers (Subtle, balanced) -->
    <circle cx="512" cy="337" r="5" fill="#6EE7B7" opacity="0.85" />
    <circle cx="410" cy="380" r="4" fill="#34D399" opacity="0.5" />
    <circle cx="614" cy="380" r="4" fill="#34D399" opacity="0.5" />

    <!-- 4. Precision Diagnostic Needle & Hub -->
    <g filter="url(#needle-shadow)">
      <!-- Needle resting poised at 50 degrees (Optimal Operating State) -->
      <g transform="translate(512, 475) rotate(-50)">
        <!-- Main Pointer Blade -->
        <path d="M 0 -18
                 L 126 -3
                 Q 132 0 126 3
                 L 0 18 Z"
              fill="url(#c1-needle-grad)" />
        <!-- Ridge Bevel -->
        <path d="M 0 0 L 126 0" stroke="#CBD5E1" stroke-width="2" />
        <!-- Luminous Tip Accent -->
        <path d="M 96 -3 L 126 0 L 96 3 Z" fill="#34D399" />
      </g>

      <!-- CNC Center Hub Housing -->
      <circle cx="512" cy="475" r="35" fill="#070D18" stroke="#34D399" stroke-width="6" />
      <circle cx="512" cy="475" r="22" fill="#132036" />
      <circle cx="512" cy="475" r="10" fill="#FFFFFF" />
      <circle cx="510" cy="473" r="3" fill="#FFFFFF" opacity="0.9" />
    </g>
  </g>
</svg>