name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS)
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          ls /Applications | grep Xcode
          test -d /Applications/Xcode_16.4.app || { echo "Xcode 16.4 is missing from this runner" >&2; exit 1; }
          sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Verify Swift Version
        run: swift --version

      - name: Build Package
        run: swift build -v

      - name: Run Test Suite
        # Host-changing maintenance, Keychain, and telemetry DB tests remain skipped until TASK-006 makes them hermetic.
        run: swift test --enable-code-coverage --skip testMaintenanceServiceMethods --skip testKeychainManagerSaveLoadDelete --skip testTelemetryStoreRecordAndPurge --skip testTelemetryStoreFetchHistoryAndDownsampling

      - name: Build Release App Bundle
        run: ./Scripts/build_app.sh
