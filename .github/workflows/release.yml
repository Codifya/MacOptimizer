name: Release Build

# Tags v* build an UNSIGNED universal DMG as a workflow artifact (never a release asset).
# If the signing secrets exist, a second job signs, notarizes and staples the DMG with
# Scripts/release.sh and creates a DRAFT GitHub release for the human to publish.
# Without secrets the signed release is produced locally (docs/RELEASING.md).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-unsigned:
    name: Build unsigned DMG
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # CFBundleVersion = git rev-list --count HEAD

      - name: Select Xcode 16.4
        run: |
          test -d /Applications/Xcode_16.4.app || { echo "Xcode 16.4 is missing from this runner" >&2; exit 1; }
          sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Check tag matches VERSION
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} != v${version} (VERSION file)" >&2; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Build app bundle (universal)
        env:
          UNIVERSAL: "1"
          SCRATCH_PATH: ${{ runner.temp }}/swift-build
        run: ./Scripts/build_app.sh

      - name: Package unsigned DMG
        shell: bash
        run: |
          mkdir -p dist/dmg-root
          ditto MacOptimizer.app dist/dmg-root/MacOptimizer.app
          ln -s /Applications dist/dmg-root/Applications
          dmg="MacOptimizer-${VERSION}-unsigned.dmg"
          hdiutil create -volname "MacOptimizer ${VERSION}" -srcfolder dist/dmg-root -fs HFS+ -format UDZO -ov "dist/${dmg}"
          (cd dist && shasum -a 256 "${dmg}" > "${dmg}.sha256")

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacOptimizer-unsigned
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error

  check-signing-secrets:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ] && [ -n "$ASC_KEY_ID" ] \
             && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not configured; skipping signed release (sign locally, see docs/RELEASING.md)."
          fi

  sign-and-notarize:
    name: Sign, notarize and draft release
    needs: [build-unsigned, check-signing-secrets]
    if: needs.check-signing-secrets.outputs.enabled == 'true'
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app

      - name: Import signing certificate into a temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          cert="${RUNNER_TEMP}/cert.p12"
          printf '%s' "${MACOS_CERT_P12}" | base64 --decode > "${cert}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 3600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${cert}" -k "${keychain}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${keychain_password}" "${keychain}" >/dev/null
          # shellcheck disable=SC2046 # the existing keychain list must word-split
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          rm -f "${cert}"
          identity="$(security find-identity -v -p codesigning "${keychain}" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          test -n "${identity}" || { echo "No Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "SIGN_IDENTITY=${identity}" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=${keychain}" >> "$GITHUB_ENV"

      - name: Write notary API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        shell: bash
        run: |
          umask 077
          printf '%s' "${ASC_KEY_P8}" > "${RUNNER_TEMP}/AuthKey.p8"
          echo "NOTARY_KEY_PATH=${RUNNER_TEMP}/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and staple
        env:
          NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          SCRATCH_PATH: ${{ runner.temp }}/swift-build
        run: ./Scripts/release.sh

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'dist/MacOptimizer-*.dmg'

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MacOptimizer-*.dmg
            dist/MacOptimizer-*.dmg.sha256
          generate_release_notes: true
          draft: true
          prerelease: false

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/AuthKey.p8" "${RUNNER_TEMP}/cert.p12"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then security delete-keychain "${SIGNING_KEYCHAIN}" || true; fi
